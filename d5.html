<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 치지직 컵 드래프트</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <h1>2025 <span class="accent">CHZZK CUP</span> 드래프트</h1>

    <p style="margin-bottom: 30px;">
        <a href="https://skfnbsadfkjbsdf.github.io/chzzk_draft/d5_multi.html" class="single-link">
            🎲 멀티 버전 이동
        </a>
    </p>

    <div id="screen-setup" class="container active">
        <h2>팀장(JUNGLE)을 선택하세요</h2>
        <p style="text-align: center; color: #aaa;">※ AI가 실력(Tier) 순으로 선수를 영입합니다!</p>
        <div class="captain-grid" id="captain-list"></div>
    </div>

    <div id="screen-draft" class="container">
        <div class="status-bar">
            <div id="turn-msg" class="turn-msg">게임 준비 중...</div>
            <div id="draft-info" style="font-size: 0.9rem; color: #ccc;"></div>
        </div>

        <h3>영입 가능 선수 (실력순)</h3>
        <div class="pool-grid" id="pool-list"></div>

        <h3>실시간 팀 상황</h3>
        <div class="teams-container" id="team-boards"></div>

        <div class="log-box" id="log-box"></div>
    </div>

    <div id="screen-result" class="container">
        <h2>최종 로스터</h2>
        <div class="teams-container" id="final-boards"></div>
        <button onclick="location.reload()" style="width: 100%; margin-top: 20px;">다시 도전하기</button>
    </div>

    <script>
        const CAPTAINS = ['갱맘', '뱅', '소우릎', '울프', '큐베'];
        let POOL_DATA = []; // const가 아닌 let으로 변경 (데이터를 채워넣어야 하므로)

        // [추가됨] 외부 JSON 파일 불러오기 함수
        async function loadData() {
            try {
                const response = await fetch('data/pool_data.json');
                if (!response.ok) throw new Error('데이터 로딩 실패');
                POOL_DATA = await response.json();
                console.log("선수 데이터 로드 완료:", POOL_DATA.length + "명");
            } catch (error) {
                console.error("데이터 로드 중 오류 발생:", error);
                alert("선수 데이터를 불러오는데 실패했습니다. (로컬 실행 시 서버 필요)");
            }
        }

        // 페이지 로드 시 데이터 불러오기 실행
        loadData();

        let myCaptain = "";
        let teams = {};
        let draftOrder = [];
        let availablePlayers = [];
        let pickIndex = 0;

        function init() {
            const list = document.getElementById('captain-list');
            CAPTAINS.forEach(cap => {
                const btn = document.createElement('button');
                btn.innerText = cap;
                btn.onclick = () => startGame(cap);
                list.appendChild(btn);
            });
        }

        function startGame(selected) {
            try {
                myCaptain = selected;

                // 데이터 복사 및 점수순 정렬
                availablePlayers = JSON.parse(JSON.stringify(POOL_DATA)).sort((a, b) => b.score - a.score);

                // 팀 초기화 (roster 속성 없이 바로 저장)
                teams = {}; // 전역변수 초기화
                CAPTAINS.forEach(cap => {
                    teams[cap] = { TOP: null, JUNGLE: cap, MID: null, BOT: null, SUP: null };
                });

                draftOrder = [...CAPTAINS].sort(() => Math.random() - 0.5);

                document.getElementById('screen-setup').classList.remove('active');
                document.getElementById('screen-draft').classList.add('active');

                addLog(`드래프트 순서: ${draftOrder.join(' → ')}`);

                // 렌더링 및 턴 시작
                renderBoards();
                processTurn();

            } catch (e) {
                alert("오류 발생: " + e.message);
                console.error(e);
            }
        }

        function getCurrentPicker() {
            const round = Math.floor(pickIndex / 5);
            const idxInRound = pickIndex % 5;
            const actualIdx = (round % 2 === 0) ? idxInRound : (4 - idxInRound);
            return draftOrder[actualIdx];
        }

        function processTurn() {
            if (pickIndex >= 20) {
                endGame();
                return;
            }

            const picker = getCurrentPicker();
            const isMe = (picker === myCaptain);

            const turnMsg = document.getElementById('turn-msg');
            turnMsg.innerText = isMe ? "당신의 차례입니다!" : `${picker} 님이 고민 중...`;
            turnMsg.style.color = isMe ? "var(--chzzk-green)" : "white";

            document.getElementById('draft-info').innerText = `라운드 ${Math.floor(pickIndex / 5) + 1} / 4 (전체 ${pickIndex + 1}픽)`;

            highlightBoard(picker);
            renderPool(isMe ? teams[myCaptain] : null);

            if (!isMe) {
                setTimeout(() => aiPick(picker), 800 + Math.random() * 500);
            }
        }

        function aiPick(pickerName) {
            const roster = teams[pickerName];
            const neededPos = ['TOP', 'MID', 'BOT', 'SUP'].filter(p => roster[p] === null);
            const candidates = availablePlayers.filter(p => neededPos.includes(p.pos));

            if (candidates.length > 0) {
                candidates.sort((a, b) => b.score - a.score);
                const bestPick = candidates[0];
                confirmPick(pickerName, bestPick);
            }
        }

        function userPick(idx) {
            const picker = getCurrentPicker();
            if (picker !== myCaptain) return;

            const player = availablePlayers[idx];
            if (teams[myCaptain][player.pos] !== null) {
                alert("이미 해당 포지션 선수가 있습니다!");
                return;
            }

            confirmPick(myCaptain, player);
        }

        function confirmPick(pickerName, player) {
            teams[pickerName][player.pos] = player.name;

            const realIdx = availablePlayers.findIndex(p => p.name === player.name && p.pos === player.pos);
            if (realIdx > -1) availablePlayers.splice(realIdx, 1);

            addLog(`[${pickerName}] ${player.name} (${player.pos}, ${player.tier}급) 영입!`);

            pickIndex++;
            renderBoards();
            processTurn();
        }

        function highlightBoard(picker) {
            document.querySelectorAll('.team-board').forEach(b => b.classList.remove('current-turn'));
            const target = document.getElementById(`board-${picker}`);
            if (target) target.classList.add('current-turn');
        }

        function renderBoards() {
            const boardContainer = document.getElementById('team-boards');
            boardContainer.innerHTML = '';

            const order = (draftOrder && draftOrder.length > 0) ? draftOrder : CAPTAINS;

            order.forEach(cap => {
                const t = teams[cap];
                const isMe = cap === myCaptain;

                let html = `<div id="board-${cap}" class="team-board ${isMe ? 'my-team' : ''}">
                    <div class="team-header">${cap} ${isMe ? '(나)' : ''}</div>`;

                ['TOP', 'JUNGLE', 'MID', 'BOT', 'SUP'].forEach(pos => {
                    const mem = t[pos];
                    html += `<div class="roster-row ${mem ? 'filled' : ''}">
                        <span>${pos}</span> <span>${mem || '-'}</span>
                    </div>`;
                });
                html += `</div>`;
                boardContainer.innerHTML += html;
            });
        }

        function renderPool(myRoster) {
            const pool = document.getElementById('pool-list');
            pool.innerHTML = '';

            availablePlayers.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = 'player-card';

                if (myRoster && myRoster[p.pos] !== null) {
                    div.classList.add('disabled');
                }

                const tierVal = p.tier || 'C';
                const tierClass = `tier-${tierVal.charAt(0)}`;

                div.innerHTML = `
                    <div class="tier-badge ${tierClass}">${tierVal}</div>
                    <span class="pos-badge pos-${p.pos}">${p.pos}</span><br>
                    <strong style="font-size:1.1em;">${p.name}</strong>
                `;
                div.onclick = () => userPick(idx);
                pool.appendChild(div);
            });
        }

        function addLog(msg) {
            const box = document.getElementById('log-box');
            const p = document.createElement('div');
            p.innerHTML = `> ${msg}`;
            if (msg.includes('영입')) p.classList.add('log-hl');
            box.prepend(p);
        }

        function endGame() {
            document.getElementById('screen-draft').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            document.getElementById('final-boards').innerHTML = document.getElementById('team-boards').innerHTML;
        }

        init();
    </script>
</body>

</html>
