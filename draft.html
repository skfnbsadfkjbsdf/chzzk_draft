<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 치지직 컵 모의 경매 시뮬레이터</title>
    <style>
        :root {
            --chzzk-green: #00ffa3;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1, h2 { text-align: center; margin-bottom: 10px; }
        .accent { color: var(--chzzk-green); font-weight: bold; }
        
        /* Setup Screen */
        #setup-screen, #auction-screen, #result-screen {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; /* Default hidden */
        }
        #setup-screen.active, #auction-screen.active, #result-screen.active { display: block; }

        .captain-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        button {
            background: #333;
            color: white;
            border: 2px solid var(--chzzk-green);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        button:hover { background: var(--chzzk-green); color: black; }
        button:disabled { border-color: #555; color: #777; cursor: not-allowed; background: #222; }

        /* Auction Screen */
        .auction-stage {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #444;
            border-radius: 10px;
        }
        .current-player { font-size: 2rem; font-weight: bold; color: var(--chzzk-green); margin: 10px 0; }
        .position-badge { background: #444; padding: 5px 10px; border-radius: 4px; font-size: 0.9rem; }
        .current-bid { font-size: 1.5rem; margin: 15px 0; }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .log-box {
            height: 150px;
            overflow-y: auto;
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ccc;
        }
        .log-item { margin-bottom: 5px; }
        .log-item.bid { color: var(--chzzk-green); }
        .log-item.sold { color: #ff5555; font-weight: bold; }

        /* Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 30px;
        }
        .team-card {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .team-card.my-team { border: 1px solid var(--chzzk-green); }
        .team-header { font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .budget { color: #aaa; font-size: 0.8rem; margin-bottom: 5px; }
        .member-list div { margin-top: 2px; }
        .filled { color: var(--chzzk-green); }
        .empty { color: #555; }

    </style>
</head>
<body>

    <h1>2025 <span class="accent">CHZZK CUP</span> 모의 경매</h1>

    <div id="setup-screen" class="active">
        <h2>플레이할 팀장(JUNGLE)을 선택하세요</h2>
        <p style="text-align: center; color: #aaa;">초기 포인트: 1,000P</p>
        <div class="captain-select" id="captain-buttons">
            </div>
    </div>

    <div id="auction-screen">
        <div class="auction-stage">
            <div>현재 경매 매물</div>
            <div id="target-position" class="position-badge">TOP</div>
            <div id="target-name" class="current-player">선수 이름</div>
            <hr style="border-color: #333; margin: 15px 0;">
            
            <div class="current-bid">
                현재 최고 입찰가: <span id="highest-bid" class="accent">0</span> P
                <br>
                <span id="highest-bidder" style="font-size: 1rem; color: #aaa;">(입찰 없음)</span>
            </div>

            <div class="controls">
                <button onclick="playerBid(10)">+10 P</button>
                <button onclick="playerBid(50)">+50 P</button>
                <button onclick="giveUp()" style="border-color: #ff5555;">입찰 포기 / 패스</button>
            </div>
            <div id="status-msg" style="margin-top: 10px; color: #aaa; height: 20px;"></div>
        </div>

        <div class="log-box" id="log-box"></div>

        <h3>실시간 팀 현황</h3>
        <div class="dashboard" id="dashboard">
            </div>
    </div>

    <div id="result-screen">
        <h2>최종 로스터 확정</h2>
        <div class="dashboard" id="final-result"></div>
        <button onclick="location.reload()" style="width: 100%; margin-top: 20px;">다시 하기</button>
    </div>

    <script>
        // 데이터 세팅 (이미지 기반)
        const CAPTAINS = ['갱맘', '뱅', '소우릎', '울프', '큐베'];
        
        const POOL = [
            // TOP
            { name: '김뿡', pos: 'TOP' }, { name: '룩삼', pos: 'TOP' }, 
            { name: '얍얍', pos: 'TOP' }, { name: '운타라', pos: 'TOP' }, { name: '한동숙', pos: 'TOP' },
            // MID (이미지 텍스트 추정)
            { name: '랄로', pos: 'MID' }, { name: '앰비션', pos: 'MID' }, 
            { name: '인섹', pos: 'MID' }, { name: '토마토', pos: 'MID' }, { name: '피닉스박', pos: 'MID' },
            // BOT
            { name: '괴물쥐', pos: 'BOT' }, { name: '따효니', pos: 'BOT' }, 
            { name: '러너', pos: 'BOT' }, { name: '명예훈장', pos: 'BOT' }, { name: '삼식', pos: 'BOT' },
            // SUP
            { name: '던', pos: 'SUP' }, { name: '소풍왔니', pos: 'SUP' }, 
            { name: '순당무', pos: 'SUP' }, { name: '인간젤리', pos: 'SUP' }, { name: '푸린', pos: 'SUP' }
        ];

        let myTeamName = "";
        let teams = {}; // { '갱맘': { budget: 1000, roster: {TOP:null...} }, ... }
        let auctionQueue = [];
        let currentItem = null;
        let currentBid = 0;
        let currentBidder = null;
        let isMyTurn = false;
        let auctionTimer = null;
        let userGiveUp = false;

        // 초기화
        function init() {
            const btnContainer = document.getElementById('captain-buttons');
            CAPTAINS.forEach(cap => {
                const btn = document.createElement('button');
                btn.innerText = cap;
                btn.onclick = () => startGame(cap);
                btnContainer.appendChild(btn);
            });
        }

        function startGame(selectedCaptain) {
            myTeamName = selectedCaptain;
            
            // 팀 초기화
            CAPTAINS.forEach(cap => {
                teams[cap] = {
                    budget: 1000,
                    roster: { TOP: null, MID: null, BOT: null, SUP: null } // 정글은 본인
                };
            });

            // 매물 셔플
            auctionQueue = [...POOL].sort(() => Math.random() - 0.5);

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('auction-screen').classList.add('active');
            
            updateDashboard();
            startNextAuction();
        }

        function startNextAuction() {
            if (auctionQueue.length === 0) {
                endGame();
                return;
            }

            currentItem = auctionQueue.pop();
            currentBid = 0;
            currentBidder = null;
            userGiveUp = false;

            // 화면 갱신
            document.getElementById('target-position').innerText = currentItem.pos;
            document.getElementById('target-name').innerText = currentItem.name;
            document.getElementById('highest-bid').innerText = "0";
            document.getElementById('highest-bidder').innerText = "-";
            addLog(`--- [${currentItem.pos}] ${currentItem.name} 경매 시작 ---`);

            // AI 자동 입찰 시작
            processBidRound();
        }

        // 경매 라운드 진행 (AI 로직)
        function processBidRound() {
            if (checkAuctionEnd()) return;

            // 약간의 딜레이 후 AI들이 입찰 판단
            setTimeout(() => {
                // AI 팀장들 입찰 시도
                let bidHappened = false;
                const aiCaptains = CAPTAINS.filter(c => c !== myTeamName);
                
                // 랜덤하게 섞어서 순서 결정
                aiCaptains.sort(() => Math.random() - 0.5);

                for (let cap of aiCaptains) {
                    // 이미 해당 포지션이 있거나, 돈이 없으면 패스
                    if (teams[cap].roster[currentItem.pos]) continue;
                    if (teams[cap].budget <= currentBid) continue;

                    // 입찰 로직 (확률적)
                    // 예: 현재가가 내 예산의 40% 미만이면 적극 입찰
                    const limit = teams[cap].budget * 0.8; 
                    const wantFactor = Math.random() > 0.3; // 70% 확률로 입찰 참가

                    if (wantFactor && currentBid + 10 <= teams[cap].budget) {
                        // 내가 최고 입찰자가 아니면 입찰
                        if (currentBidder !== cap) {
                            makeBid(cap, currentBid + (Math.random() > 0.8 ? 20 : 10)); // 가끔 20포인트 점프
                            bidHappened = true;
                            break; // 한 턴에 한 명만 입찰하고 다시 사용자에게 기회 줌 (간단화)
                        }
                    }
                }

                if (!bidHappened) {
                    // 아무도 입찰 안함 -> 사용자가 입찰했거나 아무도 안했으면 카운트다운 후 낙찰
                    if (userGiveUp || currentBidder === myTeamName) {
                         finishItem();
                    } else {
                        // 사용자에게 턴이 왔지만 사용자가 포기 안함 -> 대기
                         document.getElementById('status-msg').innerText = "당신의 차례입니다.";
                    }
                } else {
                    // AI가 입찰했음. 사용자 턴
                    if (userGiveUp) {
                        processBidRound(); // 사용자가 포기했으면 계속 AI끼리
                    } else {
                        document.getElementById('status-msg').innerText = "당신의 차례입니다.";
                    }
                }

            }, 800); // 속도 조절
        }

        function makeBid(who, amount) {
            currentBid = amount;
            currentBidder = who;
            document.getElementById('highest-bid').innerText = currentBid;
            document.getElementById('highest-bidder').innerText = who;
            addLog(`${who}: ${amount} P 입찰`);
            
            if (who === myTeamName) {
                document.getElementById('status-msg').innerText = "현재 최고 입찰자입니다.";
                processBidRound(); // AI 턴으로 넘김
            }
        }

        // 사용자 동작
        function playerBid(addAmount) {
            if (userGiveUp) return;
            const nextBid = currentBid + addAmount;
            
            // 해당 포지션 이미 있는지 체크
            if (teams[myTeamName].roster[currentItem.pos]) {
                alert("이미 해당 포지션 선수가 있습니다.");
                return;
            }
            // 예산 체크
            if (teams[myTeamName].budget < nextBid) {
                alert("포인트가 부족합니다.");
                return;
            }
            // 내가 이미 최고입찰자인지
            if (currentBidder === myTeamName) {
                alert("이미 최고 입찰자입니다.");
                return;
            }

            makeBid(myTeamName, nextBid);
        }

        function giveUp() {
            userGiveUp = true;
            document.getElementById('status-msg').innerText = "입찰을 포기했습니다. 결과를 기다립니다...";
            addLog(`${myTeamName}: 입찰 포기`);
            processBidRound();
        }

        function checkAuctionEnd() {
            // 만약 모든 팀이 해당 포지션이 있거나 예산이 없으면 즉시 종료
            // 여기서는 간단히 AI 루프에서 처리
            return false; 
        }

        function finishItem() {
            if (currentBidder) {
                teams[currentBidder].budget -= currentBid;
                teams[currentBidder].roster[currentItem.pos] = currentItem.name;
                addLog(`🎉 [낙찰] ${currentItem.name} -> ${currentBidder} 팀 (${currentBid} P)`, 'sold');
            } else {
                addLog(`❌ ${currentItem.name} 유찰되었습니다.`);
                // 유찰된 선수는 다시 큐에 넣을 수도 있지만 여기선 그냥 버림(또는 맨 뒤로)
            }
            
            updateDashboard();
            setTimeout(startNextAuction, 2000);
        }

        function updateDashboard() {
            const board = document.getElementById('dashboard');
            board.innerHTML = "";
            
            CAPTAINS.forEach(cap => {
                const t = teams[cap];
                const isMe = cap === myTeamName ? 'my-team' : '';
                
                let rosterHtml = "";
                ['TOP', 'MID', 'BOT', 'SUP'].forEach(pos => {
                    const mem = t.roster[pos];
                    const cls = mem ? 'filled' : 'empty';
                    rosterHtml += `<div class="${cls}">${pos}: ${mem || '-'}</div>`;
                });

                board.innerHTML += `
                    <div class="team-card ${isMe}">
                        <div class="team-header">${cap} 팀 ${isMe ? '(나)' : ''}</div>
                        <div class="budget">잔여: ${t.budget} P</div>
                        <div class="member-list">
                            ${rosterHtml}
                        </div>
                    </div>
                `;
            });
        }

        function addLog(msg, type='') {
            const box = document.getElementById('log-box');
            const p = document.createElement('div');
            p.className = `log-item ${type}`;
            p.innerText = msg;
            box.prepend(p);
        }

        function endGame() {
            document.getElementById('auction-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            // 결과 화면 복사
            document.getElementById('final-result').innerHTML = document.getElementById('dashboard').innerHTML;
        }

        init();
    </script>
</body>
</html>
