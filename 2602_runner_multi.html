<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>러너리그 모의 드래프트</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="css/style1.css" />
  <style>
    /* 추가 스타일: 티어 숨기기 */
    .tier-badge {
      display: none !important;
    }

    .pos-DEALER {
      background-color: #ff4d4d !important;
      color: white;
    }

    .pos-HEALER {
      background-color: #4da6ff !important;
      color: white;
    }

    .pos-TANK {
      background-color: #ffd11a !important;
      color: black;
    }
  </style>
</head>

<body>
  <h1><span class="accent">RUNNER LEAGUE</span> 모의 드래프트</h1>

  <div id="screen-lobby" class="container active">
    <div class="lobby-box">
      <h2>대기실</h2>
      <div id="initial-choice">
        <button onclick="createRoom()">방 만들기 (Host)</button>
        <br /><br />
        <div>
          <input type="text" id="room-id-input" placeholder="방 ID 입력" />
          <button onclick="joinRoom()">참가하기 (Guest)</button>
        </div>
        <p id="conn-status" style="color: #aaa; margin-top: 10px"></p>
      </div>
      <div id="connected-ui" style="display: none">
        <div id="host-info" style="display: none">
          <p>아래 ID를 친구에게 공유하세요 (최대 5명)</p>
          <div id="my-room-id" class="room-id-display">생성 중...</div>
          <br />
          <button class="btn-copy" onclick="copyInviteLink()">
            📋 주소 + 방 ID 복사
          </button>
          <br><br>
          <button id="btn-force-start" class="btn-force" style="background-color: #666; color: white;"
            onclick="forceStartWithAi()">
            ⚡ 바로 시작 (남은 자리 AI 채우기)
          </button>
        </div>
        <div class="player-list">
          <strong>접속자 현황 (<span id="player-count">1</span>/5):</strong>
          <ul id="player-ul" style="padding-left: 20px; margin: 5px 0"></ul>
        </div>
        <p class="waiting-msg" id="lobby-status-msg">
          5명이 모두 모이면 자동으로 시작됩니다...
        </p>
      </div>
    </div>
  </div>

  <div id="screen-selection" class="container">
    <h2>팀장 선택</h2>
    <p>원하는 팀장을 선택하세요! (선착순)</p>
    <div class="timer-bar">
      <div id="selection-timer" class="timer-fill"></div>
    </div>
    <div id="selection-status" style="font-size: 1.2rem; margin-bottom: 10px">
      남은 시간: 20초
    </div>
    <div class="captain-select-grid" id="captain-list">
      <!-- Captain cards will be injected here -->
    </div>
  </div>

  <div id="screen-game" class="container">
    <div class="status-bar">
      <div id="turn-msg" class="turn-msg">게임 준비 중...</div>
      <div id="draft-info" style="font-size: 0.9rem; color: #ccc"></div>
      <div class="emote-controls">
        <button class="emote-btn" onclick="sendEmote('😂')" title="즐거움">
          😂
        </button>
        <button class="emote-btn" onclick="sendEmote('😲')" title="놀람">
          😲
        </button>
        <button class="emote-btn" onclick="sendEmote('😭')" title="슬픔">
          😭
        </button>
      </div>
    </div>
    <h3>영입 가능 선수</h3>
    <div class="pool-grid" id="pool-list"></div>
    <h3>실시간 팀 상황</h3>
    <div class="teams-container" id="team-boards"></div>
    <div class="log-box" id="log-box"></div>
  </div>

  <script>
    const CAPTAINS = ["댕균", "둥그레", "소우릎", "이선생", "인섹"];
    let POOL_DATA = [];

    async function loadData() {
      try {
        const response = await fetch("data/runner_pool.json");
        if (!response.ok) throw new Error("데이터 로딩 실패");
        POOL_DATA = await response.json();
        console.log("선수 데이터 로드 완료:", POOL_DATA.length + "명");
      } catch (error) {
        console.error("데이터 로드 중 오류 발생:", error);
        alert(
          "선수 데이터를 불러오는데 실패했습니다. (로컬 실행 시 서버 필요)",
        );
      }
    }

    loadData();

    let peer = null;
    let myConn = null;
    let guestConns = [];
    let isHost = false;
    let myId = null;
    let myName = "";
    let heartbeatInterval = null;
    let selectionTimerInterval = null;
    let gameState = {
      phase: "LOBBY", // LOBBY, SELECTION, DRAFT
      isStarted: false,
      players: [],
      teams: {},
      availablePlayers: [],
      draftOrder: [],
      pickIndex: 0,
      logs: [],
      captainSelection: {
        startTime: 0,
        selections: {}, // captainName -> playerId
        timeLeft: 20,
      },
    };
    let emoteCooldown = false;

    window.addEventListener("beforeunload", () => {
      if (isHost) {
      } else if (myConn && myConn.open) {
        myConn.send({ type: "LEAVE", peerId: myId });
      }
    });

    function copyInviteLink() {
      if (!myId) return alert("아직 방이 생성되지 않았습니다.");
      const url = window.location.href;
      const text = `[러너리그 모의 드래프트]\n\n사이트: ${url}\n방 ID: ${myId}\n\n위 링크로 접속 후 '참가하기'에 방 ID를 입력하세요!`;
      navigator.clipboard
        .writeText(text)
        .then(() => {
          alert(
            "주소와 방 ID가 복사되었습니다!\n친구들에게 붙여넣기(Ctrl+V) 하세요.",
          );
        })
        .catch((err) => {
          console.error(err);
          alert("복사에 실패했습니다. 화면의 ID를 직접 복사해주세요.");
        });
    }
    function initPeer(onOpen) {
      peer = new Peer(null, { debug: 1 });
      peer.on('open', (id) => {
        console.log('[DIAG] peer.open 이벤트 발생, id:', id);
        myId = id;
        if (onOpen) onOpen(id);
      });
      peer.on('disconnected', () => { console.warn('[DIAG] peer.disconnected - 시그널링 서버 연결 끊김'); });
      peer.on('close', () => { console.warn('[DIAG] peer.close - Peer 객체 종료'); });
      peer.on('connection', (conn) => {
        console.log('[DIAG] HOST: 새 연결 수신, peer:', conn.peer, 'open:', conn.open);
        if (!isHost) return;
        conn.on('open', () => { console.log('[DIAG] HOST: conn.open 이벤트 발생, peer:', conn.peer); handleGuestJoin(conn); });
        conn.on('data', (data) => {
          if (data.type === 'LEAVE') {
            handleGuestLeave(conn.peer);
            return;
          }
          handlePong(conn.peer);

          if (data.type === 'PING') { }
          if (data.type === 'PICK') handlePickRequest(conn.peer, data.idx);
          if (data.type === 'EMOTE') {
            triggerEmoteDisplay(data.captain, data.emoji);
            broadcastData({ type: 'EMOTE', captain: data.captain, emoji: data.emoji });
          }
          if (data.type === 'SELECT_CAPTAIN') handleCaptainSelect(conn.peer, data.captain);
        });
        conn.on('close', () => { console.warn('[DIAG] HOST: conn.close, peer:', conn.peer); handleGuestLeave(conn.peer); });
        conn.on('error', (err) => { console.error('[DIAG] HOST: conn.error, peer:', conn.peer, err); handleGuestLeave(conn.peer); });
      });
      peer.on('error', (err) => { console.error("[DIAG] peer.error:", err.type, err); });
    }

    function createRoom() {
      document.getElementById("conn-status").innerText = "방 생성 중...";
      isHost = true;
      myName = "방장(나)";
      initPeer((id) => {
        document.getElementById("initial-choice").style.display = "none";
        document.getElementById("connected-ui").style.display = "block";
        document.getElementById("host-info").style.display = "block";
        document.getElementById("my-room-id").innerText = id;
        gameState.players.push({
          id: id,
          name: myName,
          assignedCaptain: null,
          lastHeartbeat: Date.now(),
        });
        updateLobbyUI();
        startHeartbeatLoop();
      });
    }

    function joinRoom() {
      const roomId = document.getElementById("room-id-input").value.trim();
      if (!roomId) return alert("방 ID를 입력하세요");
      document.getElementById("conn-status").innerText = "접속 시도 중...";
      isHost = false;
      initPeer((id) => {
        console.log(`[DIAG] GUEST: 방(${roomId})에 연결 시도 중...`);
        myConn = peer.connect(roomId);
        console.log('[DIAG] GUEST: peer.connect() 호출 완료, conn:', myConn);
        myConn.on("open", () => {
          console.log("[DIAG] GUEST: myConn.open 이벤트 발생! 데이터 채널 오픈 성공!");
          document.getElementById("initial-choice").style.display = "none";
          document.getElementById("connected-ui").style.display = "block";
        });
        myConn.on("error", (err) => {
          console.error("[DIAG] GUEST: myConn.error:", err);
        });
        myConn.on("close", () => {
          console.warn("[DIAG] GUEST: myConn.close 이벤트 발생");
        });
        myConn.on("iceStateChanged", (state) => {
          console.log("[DIAG] GUEST: ICE state:", state);
        });
        myConn.on("data", (data) => {
          if (data.type === "PING") {
            myConn.send({ type: "PONG" });
            return;
          }
          if (data.type === "STATE_UPDATE") {
            gameState = data.state;
            if (gameState.isStarted) {
              if (gameState.phase === "SELECTION") {
                switchScreen("screen-selection");
                renderCaptainSelection();
              } else if (gameState.phase === "DRAFT") {
                switchScreen("screen-game");
                renderGame();
              }
            } else {
              updateLobbyUI();
            }
          } else if (data.type === "START_SELECTION") {
            switchScreen("screen-selection");
            renderCaptainSelection();
          } else if (data.type === "START_GAME") {
            switchScreen("screen-game");
            renderGame();
          } else if (data.type === "EMOTE") {
            triggerEmoteDisplay(data.captain, data.emoji);
          } else if (data.type === "ERROR") {
            alert(data.msg);
            location.reload();
          }
        });
        myConn.on("close", () => {
          alert("방장과의 연결이 끊어졌습니다.");
          location.reload();
        });
      });
    }

    function startHeartbeatLoop() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(() => {
        const now = Date.now();
        guestConns.forEach((c) => {
          if (c.open) c.send({ type: "PING" });
        });
        for (let i = gameState.players.length - 1; i >= 0; i--) {
          const p = gameState.players[i];
          if (p.id === myId) {
            p.lastHeartbeat = now;
            continue;
          }
          if (now - p.lastHeartbeat > 60000) {
            console.log(`Timeout: ${p.name} disconnected`);
            handleGuestLeave(p.id);
          }
        }
      }, 3000);
    }

    function handlePong(peerId) {
      const player = gameState.players.find((p) => p.id === peerId);
      if (player) player.lastHeartbeat = Date.now();
    }

    function handleGuestJoin(conn) {
      if (gameState.players.length >= 5 || gameState.isStarted) {
        setTimeout(() => {
          try {
            conn.send({ type: "ERROR", msg: "방이 꽉 찼거나 이미 시작됨." });
          } catch (e) { }
          setTimeout(() => conn.close(), 500);
        }, 500);
        return;
      }
      guestConns.push(conn);
      gameState.players.push({
        id: conn.peer,
        name: `참가자 ${gameState.players.length}`,
        assignedCaptain: null,
        lastHeartbeat: Date.now(),
      });
      broadcastState();
      checkAutoStart();
    }

    function handleGuestLeave(peerId) {
      const idx = gameState.players.findIndex((p) => p.id === peerId);
      if (idx > -1) {
        const leaver = gameState.players[idx];
        if (gameState.isStarted && leaver.assignedCaptain) {
          const cap = leaver.assignedCaptain;
          gameState.teams[cap].ownerId = "AI";
          gameState.teams[cap].ownerName = "AI (대타)";
          addGameLog(
            `🚫 ${leaver.name}님이 연결이 끊겨서 AI로 대체하여 진행합니다.`,
          );
        }
        if (gameState.phase === "SELECTION") {
          const selectedCap = Object.keys(
            gameState.captainSelection.selections,
          ).find(
            (cap) => gameState.captainSelection.selections[cap] === peerId,
          );
          if (selectedCap) {
            delete gameState.captainSelection.selections[selectedCap];
          }
        }
        gameState.players.splice(idx, 1);
        guestConns = guestConns.filter((c) => c.peer !== peerId);
        broadcastState();
        if (gameState.phase === "DRAFT") checkAiTurn();
        else if (gameState.phase === "SELECTION") {
          broadcastState();
        } else updateLobbyUI();
      }
    }

    function checkAutoStart() {
      if (gameState.isStarted) return;
      if (gameState.players.length === 5) {
        gameState.isStarted = true;
        setTimeout(() => {
          startCaptainSelection();
        }, 1000);
      }
    }

    function forceStartWithAi() {
      if (!isHost || gameState.isStarted) {
        console.warn("PeerJS: 강제 시작 중단 - 이미 시작되었거나 호스트가 아님", { isHost, isStarted: gameState.isStarted });
        return;
      }

      console.log("PeerJS: [1/4] 강제 시작 프로세스 시작 (AI 채우기)");

      try {
        // 부족한 인원만큼 더미 플레이어 추가
        const currentCount = gameState.players.length;
        const needed = 5 - currentCount;
        console.log(`PeerJS: [2/4] 현재 인원 ${currentCount}명, AI ${needed}명 추가 시도`);

        for (let i = 0; i < needed; i++) {
          const dummyId = `AI-DUMMY-${Math.random().toString(36).substr(2, 9)}`;
          gameState.players.push({
            id: dummyId,
            name: `AI 참가자 ${currentCount + i + 1}`,
            assignedCaptain: null,
            lastHeartbeat: Date.now()
          });
        }

        gameState.isStarted = true;
        const btn = document.getElementById('btn-force-start');
        if (btn) btn.style.display = 'none';

        console.log("PeerJS: [3/4] 로비 UI 업데이트 및 상태 전송");
        updateLobbyUI();
        broadcastState();

        console.log("PeerJS: [4/4] 1초 후 팀장 선택 단계로 전환 예정");
        setTimeout(() => {
          console.log("PeerJS: 팀장 선택 단계 전환 실행");
          startCaptainSelection();
        }, 1000);
      } catch (err) {
        console.error("PeerJS: 강제 시작 중 치명적 오류 발생:", err);
        alert("강제 시작 중 오류가 발생했습니다: " + err.message);
      }
    }

    function switchScreen(screenId) {
      document
        .querySelectorAll(".container")
        .forEach((el) => el.classList.remove("active"));
      document.getElementById(screenId).classList.add("active");
    }

    function startCaptainSelection() {
      console.log("PeerJS: startCaptainSelection() 호출됨");
      if (!isHost) return;
      gameState.phase = "SELECTION";
      gameState.captainSelection.startTime = Date.now();
      gameState.captainSelection.timeLeft = 20;
      gameState.captainSelection.selections = {};

      broadcastData({ type: "START_SELECTION" });
      switchScreen("screen-selection");
      renderCaptainSelection();
      broadcastState();

      if (selectionTimerInterval) clearInterval(selectionTimerInterval);
      selectionTimerInterval = setInterval(() => {
        gameState.captainSelection.timeLeft--;
        if (gameState.captainSelection.timeLeft <= 0) {
          clearInterval(selectionTimerInterval);
          finalizeCaptainSelection();
        } else {
          broadcastState();
        }
      }, 1000);
    }

    function handleCaptainSelect(peerId, captainName) {
      if (!isHost) return;
      if (gameState.phase !== "SELECTION") return;
      if (gameState.captainSelection.selections[captainName]) return;
      const existingSelection = Object.keys(
        gameState.captainSelection.selections,
      ).find((cap) => gameState.captainSelection.selections[cap] === peerId);
      if (existingSelection)
        delete gameState.captainSelection.selections[existingSelection];

      gameState.captainSelection.selections[captainName] = peerId;
      broadcastState();

      if (
        Object.keys(gameState.captainSelection.selections).length ===
        gameState.players.length
      ) {
        clearInterval(selectionTimerInterval);
        setTimeout(finalizeCaptainSelection, 1000);
      } else {
        // AI 참가자만 남았는지 확인하여 자동 넘어가기
        const unselected = gameState.players.filter(
          p => !Object.values(gameState.captainSelection.selections).includes(p.id)
        );
        const allAi = unselected.every(p => p.id.startsWith("AI-DUMMY-"));
        if (unselected.length > 0 && allAi) {
          console.log("PeerJS: 남은 참가자가 모두 AI이므로 타이머 단축");
          clearInterval(selectionTimerInterval);
          setTimeout(finalizeCaptainSelection, 500);
        }
      }
    }

    function finalizeCaptainSelection() {
      if (!isHost) return;
      const unselectedPlayers = gameState.players.filter(
        (p) =>
          !Object.values(gameState.captainSelection.selections).includes(
            p.id,
          ),
      );
      const availableCaptains = CAPTAINS.filter(
        (cap) => !gameState.captainSelection.selections[cap],
      );

      availableCaptains.sort(() => Math.random() - 0.5);

      unselectedPlayers.forEach((p, idx) => {
        if (idx < availableCaptains.length) {
          gameState.captainSelection.selections[availableCaptains[idx]] =
            p.id;
        }
      });
      gameStart();
    }

    function renderCaptainSelection() {
      const list = document.getElementById("captain-list");
      list.innerHTML = "";
      const mySelection = Object.keys(
        gameState.captainSelection.selections,
      ).find((cap) => gameState.captainSelection.selections[cap] === myId);

      CAPTAINS.forEach((cap) => {
        const div = document.createElement("div");
        div.className = "captain-card";

        const ownerId = gameState.captainSelection.selections[cap];
        const owner = gameState.players.find((p) => p.id === ownerId);

        div.innerHTML = `<h3>${cap}</h3>`;

        if (ownerId) {
          div.classList.add("taken");
          div.innerHTML += `<p>${owner ? owner.name : "Unknown"}</p>`;
          if (ownerId === myId) div.classList.add("selected");
        } else {
          div.innerHTML += `<p>선택 가능</p>`;
          div.onclick = () => {
            if (mySelection) return;
            if (isHost) handleCaptainSelect(myId, cap);
            else myConn.send({ type: "SELECT_CAPTAIN", captain: cap });
          };
        }
        list.appendChild(div);
      });

      document.getElementById("selection-status").innerText =
        `남은 시간: ${gameState.captainSelection.timeLeft}초`;
      const pct = (gameState.captainSelection.timeLeft / 20) * 100;
      document.getElementById("selection-timer").style.width = `${pct}%`;
    }

    function broadcastState() {
      const packet = { type: "STATE_UPDATE", state: gameState };
      guestConns.forEach((c) => {
        if (c.open) c.send(packet);
      });
      if (isHost) {
        if (gameState.phase === "DRAFT") renderGame();
        else if (gameState.phase === "SELECTION") renderCaptainSelection();
        else updateLobbyUI();
      }
    }

    function broadcastData(packet) {
      guestConns.forEach((c) => {
        if (c.open) c.send(packet);
      });
    }

    function updateLobbyUI() {
      const ul = document.getElementById("player-ul");
      const cnt = document.getElementById("player-count");
      ul.innerHTML = "";
      gameState.players.forEach((p) => {
        const li = document.createElement("li");
        const capInfo = p.assignedCaptain ? ` - [${p.assignedCaptain}]` : "";
        li.innerText = p.name + capInfo;
        if (p.id === myId) li.style.color = "var(--chzzk-green)";
        ul.appendChild(li);
      });
      cnt.innerText = gameState.players.length;
      const msgEl = document.getElementById("lobby-status-msg");
      if (gameState.players.length < 5) {
        msgEl.innerText = `플레이어를 기다리는 중... (${gameState.players.length}/5명)`;
      } else {
        msgEl.innerText = "잠시 후 게임이 시작됩니다!";
        msgEl.style.color = "var(--chzzk-green)";
      }
    }

    function sendEmote(emoji) {
      if (emoteCooldown) return;
      const myPlayer = gameState.players.find((p) => p.id === myId);
      const myCap = myPlayer ? myPlayer.assignedCaptain : null;
      if (!myCap) return alert("아직 팀이 배정되지 않았거나 관전자입니다.");
      startEmoteCooldown();
      const packet = { type: "EMOTE", captain: myCap, emoji: emoji };
      if (isHost) {
        triggerEmoteDisplay(myCap, emoji);
        broadcastData(packet);
      } else {
        myConn.send(packet);
      }
    }

    function startEmoteCooldown() {
      emoteCooldown = true;
      const btns = document.querySelectorAll(".emote-btn");
      btns.forEach((b) => (b.disabled = true));
      setTimeout(() => {
        emoteCooldown = false;
        btns.forEach((b) => (b.disabled = false));
      }, 4000);
    }

    function triggerEmoteDisplay(captainName, emoji) {
      const headerId = `header-${captainName}`;
      const headerEl = document.getElementById(headerId);
      if (headerEl) {
        const span = document.createElement("span");
        span.className = "floating-emote";
        span.innerText = emoji;
        headerEl.appendChild(span);
        setTimeout(() => {
          span.remove();
        }, 3000);
      }
    }

    function gameStart() {
      if (!isHost) return;
      gameState.phase = "DRAFT";
      gameState.availablePlayers = JSON.parse(JSON.stringify(POOL_DATA));
      // 점수가 모두 100이므로 정렬 의미 없음
      gameState.draftOrder = [...CAPTAINS].sort(() => Math.random() - 0.5);
      gameState.pickIndex = 0;
      gameState.teams = {};

      CAPTAINS.forEach((cap) => {
        gameState.teams[cap] = {
          TANK: cap,
          DEALER1: null,
          DEALER2: null,
          HEALER1: null,
          HEALER2: null,
          ownerId: "AI",
          ownerName: "AI",
        };
      });
      gameState.players.forEach((p) => {
        // AI 더미 플레이어는 건너뛰기 (ownerId를 'AI'로 유지)
        if (p.id.startsWith("AI-DUMMY")) return;
        const assignedCap = Object.keys(
          gameState.captainSelection.selections,
        ).find((c) => gameState.captainSelection.selections[c] === p.id);
        if (assignedCap) {
          p.assignedCaptain = assignedCap;
          gameState.teams[assignedCap].ownerId = p.id;
          gameState.teams[assignedCap].ownerName = p.name;
        }
      });
      addGameLog(
        `게임 시작! 드래프트 순서: ${gameState.draftOrder.join(" → ")}`,
      );
      guestConns.forEach((c) => {
        if (c.open) c.send({ type: "START_GAME" });
      });
      switchScreen("screen-game");
      broadcastState();
      checkAiTurn();
    }

    function handlePickRequest(peerId, playerIdx) {
      if (!isHost) return;
      const currentCap = getCurrentPicker();
      const teamInfo = gameState.teams[currentCap];
      if (teamInfo.ownerId !== peerId) return;
      processPick(currentCap, playerIdx);
    }

    function processPick(capName, playerIdx) {
      if (playerIdx < 0 || playerIdx >= gameState.availablePlayers.length)
        return;
      const player = gameState.availablePlayers[playerIdx];
      if (!player) return;

      // 포지션에 맞는 빈 슬롯 찾기
      let targetSlot = null;
      if (player.pos === "DEALER") {
        if (gameState.teams[capName]["DEALER1"] === null)
          targetSlot = "DEALER1";
        else if (gameState.teams[capName]["DEALER2"] === null)
          targetSlot = "DEALER2";
      } else if (player.pos === "HEALER") {
        if (gameState.teams[capName]["HEALER1"] === null)
          targetSlot = "HEALER1";
        else if (gameState.teams[capName]["HEALER2"] === null)
          targetSlot = "HEALER2";
      }

      if (!targetSlot) return;

      gameState.teams[capName][targetSlot] = player.name;
      gameState.availablePlayers.splice(playerIdx, 1);
      addGameLog(`[${capName}] ${player.name} (${player.pos}) 영입!`);
      gameState.pickIndex++;
      broadcastState();
      checkAiTurn();
    }

    function checkAiTurn() {
      if (gameState.pickIndex >= 20) return;
      const currentCap = getCurrentPicker();
      // 콘솔로 AI 턴인지 확인
      console.log(`[Turn Check] Idx: ${gameState.pickIndex}, Cap: ${currentCap}, Owner: ${gameState.teams[currentCap].ownerId}`);

      const teamInfo = gameState.teams[currentCap];
      // ownerId가 "AI"로 시작하는 경우
      if (teamInfo.ownerId && teamInfo.ownerId.startsWith("AI")) {
        // 1초 뒤 자동 픽 (너무 빠르면 어색함)
        setTimeout(() => aiPick(currentCap), 1000);
      }
    }

    function aiPick(capName) {
      console.log(`[AI Pick] Executing for ${capName}`);
      const roster = gameState.teams[capName];

      // !roster[...] 체크가 더 확실함 (null, undefined, "" 모두 체크)
      const availableDealerSlots =
        (!roster["DEALER1"] ? 1 : 0) +
        (!roster["DEALER2"] ? 1 : 0);
      const availableHealerSlots =
        (!roster["HEALER1"] ? 1 : 0) +
        (!roster["HEALER2"] ? 1 : 0);

      console.log(`[AI Pick] Needs: Dealer(${availableDealerSlots}), Healer(${availableHealerSlots})`);

      const candidates = gameState.availablePlayers.filter((p) => {
        if (p.pos === "DEALER" && availableDealerSlots > 0) return true;
        if (p.pos === "HEALER" && availableHealerSlots > 0) return true;
        return false;
      });

      if (candidates.length > 0) {
        const randIdx = Math.floor(Math.random() * candidates.length);
        const pickName = candidates[randIdx].name;
        const realIdx = gameState.availablePlayers.findIndex(
          (p) => p.name === pickName,
        );
        console.log(`[AI Pick] Selected: ${pickName}`);
        processPick(capName, realIdx);
      } else {
        console.error("[AI Pick] No candidates found! This shouldn't happen unless pool is empty.");
      }
    }

    function getCurrentPicker() {
      const idx = gameState.pickIndex;
      const round = Math.floor(idx / 5);
      const idxInRound = idx % 5;
      const actualIdx = round % 2 === 0 ? idxInRound : 4 - idxInRound;
      return gameState.draftOrder[actualIdx];
    }

    function addGameLog(msg) {
      gameState.logs.push(msg);
    }

    function renderGame() {
      const logBox = document.getElementById("log-box");
      logBox.innerHTML = "";
      [...gameState.logs].reverse().forEach((msg) => {
        const div = document.createElement("div");
        div.innerHTML = `> ${msg}`;
        if (msg.includes("영입")) div.classList.add("log-hl");
        if (msg.includes("연결이 끊겨서")) div.classList.add("log-error");
        logBox.appendChild(div);
      });
      if (gameState.pickIndex >= 20) {
        document.getElementById("turn-msg").innerText = "드래프트 종료!";
        document.getElementById("draft-info").innerText =
          "모든 로스터가 확정되었습니다.";
        renderBoards();
        renderPool();
        return;
      }
      const currentCap = getCurrentPicker();
      const teamInfo = gameState.teams[currentCap];
      const isMyTurn = teamInfo.ownerId === myId;
      const turnMsg = document.getElementById("turn-msg");
      if (isMyTurn) {
        turnMsg.innerText = "당신의 차례입니다! 선수를 선택하세요.";
        turnMsg.style.color = "var(--chzzk-green)";
      } else {
        turnMsg.innerText = `${currentCap} (${teamInfo.ownerName}) 님이 고민 중...`;
        turnMsg.style.color = "white";
      }
      document.getElementById("draft-info").innerText =
        `라운드 ${Math.floor(gameState.pickIndex / 5) + 1} / 4 (전체 ${gameState.pickIndex + 1}픽)`;
      renderPool(isMyTurn, currentCap);
      renderBoards(currentCap);
    }

    function renderPool(isMyTurn, currentCap) {
      const pool = document.getElementById("pool-list");
      pool.innerHTML = "";
      gameState.availablePlayers.forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "player-card";
        let disabled = false;
        if (isMyTurn) {
          // 해당 포지션 슬롯이 남아있는지 확인
          if (
            p.pos === "DEALER" &&
            gameState.teams[currentCap]["DEALER1"] !== null &&
            gameState.teams[currentCap]["DEALER2"] !== null
          )
            disabled = true;
          if (
            p.pos === "HEALER" &&
            gameState.teams[currentCap]["HEALER1"] !== null &&
            gameState.teams[currentCap]["HEALER2"] !== null
          )
            disabled = true;
        } else {
          disabled = true;
        }
        if (disabled) div.classList.add("disabled");

        div.innerHTML = `
                    <span class="pos-badge pos-${p.pos}">${p.pos}</span><br>
                    <strong style="font-size:1.1em;">${p.name}</strong>
                    `;
        div.onclick = () => {
          if (!isMyTurn || disabled) return;
          if (isHost) processPick(currentCap, idx);
          else myConn.send({ type: "PICK", idx: idx });
        };
        pool.appendChild(div);
      });
    }

    function renderBoards(currentCap) {
      const boardContainer = document.getElementById("team-boards");
      boardContainer.innerHTML = "";

      const order =
        gameState.draftOrder && gameState.draftOrder.length > 0
          ? gameState.draftOrder
          : CAPTAINS;

      order.forEach((cap) => {
        const t = gameState.teams[cap];
        const isMine = t.ownerId === myId;
        const isTurn = cap === currentCap && gameState.pickIndex < 20;
        let html = `<div class="team-board ${isMine ? "my-team" : ""} ${isTurn ? "current-turn" : ""}">
                    <div class="team-header" id="header-${cap}">
                        ${cap}
                        <span class="owner-badge">${t.ownerName === "방장(나)" && !isHost ? "방장" : t.ownerName}</span>
                    </div>`;
        ["TANK", "DEALER1", "DEALER2", "HEALER1", "HEALER2"].forEach(
          (pos) => {
            const mem = t[pos];
            html += `<div class="roster-row ${mem ? "filled" : ""}">
                        <span>${pos}</span> <span>${mem || "-"}</span>
                    </div>`;
          },
        );
        html += `</div>`;
        boardContainer.innerHTML += html;
      });
    }
  </script>
</body>
