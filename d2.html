<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 치지직 컵 드래프트 시뮬레이터</title>
    <style>
        :root {
            --chzzk-green: #00ffa3;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --border: #333;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1, h2 { text-align: center; margin: 10px 0; }
        .accent { color: var(--chzzk-green); font-weight: bold; }

        /* 공통 박스 스타일 */
        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            display: none;
        }
        .container.active { display: block; }

        /* 팀장 선택 화면 */
        .captain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .btn-primary {
            background: #333; color: white; border: 2px solid var(--chzzk-green);
            padding: 15px; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; font-weight: bold;
        }
        .btn-primary:hover { background: var(--chzzk-green); color: black; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; background: #222; border-color: #444; color: #777; }

        /* 드래프트 화면 */
        .status-bar {
            text-align: center;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--chzzk-green);
        }
        .turn-indicator { font-size: 1.2rem; font-weight: bold; color: var(--chzzk-green); margin-bottom: 5px; }
        
        /* 선수 풀 (매물) */
        .pool-section { margin-bottom: 30px; }
        .pool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }
        .player-card {
            background: #333;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #444;
            transition: 0.2s;
        }
        .player-card:hover { border-color: var(--chzzk-green); background: #444; }
        .player-card.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
        .player-card.picked { background: #111; color: #555; border-color: #222; text-decoration: line-through; pointer-events: none; }
        
        .pos-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .pos-TOP { background: #ff5f5f; color: white; }
        .pos-MID { background: #5fafff; color: white; }
        .pos-BOT { background: #ffaf5f; color: black; }
        .pos-SUP { background: #af5fff; color: white; }

        /* 팀 현황판 */
        .teams-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            overflow-x: auto;
        }
        .team-board {
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            min-width: 140px;
        }
        .team-board.my-team { border: 2px solid var(--chzzk-green); background: #2f3f35; }
        .team-board.current-turn { box-shadow: 0 0 10px var(--chzzk-green); border-color: var(--chzzk-green); }
        
        .team-name { font-weight: bold; text-align: center; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 5px; }
        .roster-slot { font-size: 0.9rem; padding: 4px 0; display: flex; justify-content: space-between; }
        .roster-slot.empty { color: #555; }
        .roster-slot.filled { color: white; }

        /* 로그 */
        .log-box {
            height: 100px;
            overflow-y: auto;
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 20px;
        }
        .log-new { color: var(--chzzk-green); }

        @media (max-width: 768px) {
            .teams-container { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <h1>2025 <span class="accent">CHZZK CUP</span> 드래프트</h1>

    <div id="screen-setup" class="container active">
        <h2>플레이할 팀장(JUNGLE) 선택</h2>
        <div class="captain-grid" id="captain-list"></div>
    </div>

    <div id="screen-draft" class="container">
        <div class="status-bar">
            <div id="turn-msg" class="turn-indicator">드래프트 준비 중...</div>
            <div id="draft-progress" style="font-size: 0.9rem; color: #aaa;">라운드 1 / 4</div>
        </div>

        <h3>선수 선택 (클릭하여 영입)</h3>
        <div class="pool-section">
            <div id="pool-list" class="pool-grid"></div>
        </div>

        <h3>실시간 팀 로스터</h3>
        <div class="teams-container" id="team-boards"></div>

        <div class="log-box" id="log-box"></div>
    </div>

    <div id="screen-result" class="container">
        <h2>드래프트 완료!</h2>
        <div class="teams-container" id="final-boards"></div>
        <button class="btn-primary" onclick="location.reload()" style="width: 100%; margin-top: 20px;">다시 하기</button>
    </div>

    <script>
        // 데이터
        const CAPTAINS = ['갱맘', '뱅', '소우릎', '울프', '큐베'];
        const POOL_DATA = [
            { name: '김뿡', pos: 'TOP' }, { name: '룩삼', pos: 'TOP' }, { name: '얍얍', pos: 'TOP' }, { name: '운타라', pos: 'TOP' }, { name: '한동숙', pos: 'TOP' },
            { name: '랄로', pos: 'MID' }, { name: '앰비션', pos: 'MID' }, { name: '인섹', pos: 'MID' }, { name: '토마토', pos: 'MID' }, { name: '피닉스박', pos: 'MID' },
            { name: '괴물쥐', pos: 'BOT' }, { name: '따효니', pos: 'BOT' }, { name: '러너', pos: 'BOT' }, { name: '명예훈장', pos: 'BOT' }, { name: '삼식', pos: 'BOT' },
            { name: '던', pos: 'SUP' }, { name: '소풍왔니', pos: 'SUP' }, { name: '순당무', pos: 'SUP' }, { name: '인간젤리', pos: 'SUP' }, { name: '푸린', pos: 'SUP' }
        ];

        // 상태 변수
        let myCaptain = "";
        let teams = {}; // { '갱맘': { TOP:null, ... } }
        let draftOrder = []; // 팀장 이름 배열 (순서)
        let currentRound = 1; // 1~4
        let pickIndex = 0; // 0 ~ 19 (총 20명 픽)
        let isSnakeReverse = false; // 스네이크 방향
        let availablePlayers = [];
        
        function init() {
            const list = document.getElementById('captain-list');
            CAPTAINS.forEach(cap => {
                const btn = document.createElement('button');
                btn.className = 'btn-primary';
                btn.innerText = cap;
                btn.onclick = () => startGame(cap);
                list.appendChild(btn);
            });
        }

        function startGame(selected) {
            myCaptain = selected;
            availablePlayers = JSON.parse(JSON.stringify(POOL_DATA)); // 복사

            // 팀 초기화
            CAPTAINS.forEach(cap => {
                teams[cap] = { TOP: null, JUNGLE: cap, MID: null, BOT: null, SUP: null };
            });

            // 드래프트 순서 랜덤 섞기
            draftOrder = [...CAPTAINS].sort(() => Math.random() - 0.5);

            // 화면 전환
            document.getElementById('screen-setup').classList.remove('active');
            document.getElementById('screen-draft').classList.add('active');

            renderBoards();
            renderPool();
            addLog(`드래프트 순서 결정: ${draftOrder.join(' → ')}`);
            
            processTurn();
        }

        function getWhoIsNext() {
            // 전체 픽 횟수: 0 ~ 19
            // 라운드당 5명 픽
            const roundIndex = Math.floor(pickIndex / 5); // 0, 1, 2, 3
            const indexInRound = pickIndex % 5;
            
            // 스네이크 로직
            // 짝수 라운드(0, 2...): 정방향 (0,1,2,3,4)
            // 홀수 라운드(1, 3...): 역방향 (4,3,2,1,0)
            let actualIndex = (roundIndex % 2 === 0) ? indexInRound : (4 - indexInRound);
            
            return draftOrder[actualIndex];
        }

        function processTurn() {
            if (pickIndex >= 20) {
                endGame();
                return;
            }

            const currentPicker = getWhoIsNext();
            const isMyTurn = (currentPicker === myCaptain);
            
            // UI 업데이트
            updateStatus(currentPicker, isMyTurn);
            highlightBoard(currentPicker);
            renderPool(isMyTurn ? teams[myCaptain] : null); // 내 턴이면 필터링 적용

            if (!isMyTurn) {
                // AI 턴: 잠시 후 자동 픽
                setTimeout(() => aiPick(currentPicker), 800);
            }
        }

        function aiPick(pickerName) {
            // 필요한 포지션 찾기
            const myRoster = teams[pickerName];
            const neededPos = ['TOP', 'MID', 'BOT', 'SUP'].filter(p => myRoster[p] === null);
            
            // 남은 선수 중 필요한 포지션인 선수들만 필터링
            const candidates = availablePlayers.filter(p => neededPos.includes(p.pos));
            
            if (candidates.length > 0) {
                // 랜덤 선택 (전략적으로 하려면 티어 구분 필요하지만 여기선 랜덤)
                const picked = candidates[Math.floor(Math.random() * candidates.length)];
                confirmPick(pickerName, picked);
            } else {
                console.error("AI 오류: 뽑을 선수가 없음");
            }
        }

        function userPick(playerIndex) {
            const player = availablePlayers[playerIndex];
            const currentPicker = getWhoIsNext();

            // 유효성 검사
            if (currentPicker !== myCaptain) return; // 내 턴 아님
            if (teams[myCaptain][player.pos] !== null) {
                alert("이미 해당 포지션 선수가 있습니다!");
                return;
            }

            confirmPick(myCaptain, player);
        }

        function confirmPick(pickerName, player) {
            // 데이터 갱신
            teams[pickerName][player.pos] = player.name;
            
            // 풀에서 제거
            const idx = availablePlayers.findIndex(p => p.name === player.name && p.pos === player.pos);
            if (idx > -1) availablePlayers.splice(idx, 1);

            addLog(`${pickerName} 팀, [${player.pos}] ${player.name} 지명!`);
            
            pickIndex++;
            renderBoards();
            processTurn();
        }

        // --- 렌더링 함수들 ---

        function updateStatus(picker, isMe) {
            const msgEl = document.getElementById('turn-msg');
            const round = Math.floor(pickIndex / 5) + 1;
            document.getElementById('draft-progress').innerText = `라운드 ${round} / 4 (전체 ${pickIndex + 1}픽)`;

            if (isMe) {
                msgEl.innerText = "당신의 차례입니다! 선수를 선택하세요.";
                msgEl.style.color = "var(--chzzk-green)";
            } else {
                msgEl.innerText = `${picker} 님이 선택 중...`;
                msgEl.style.color = "#fff";
            }
        }

        function highlightBoard(currentPicker) {
            document.querySelectorAll('.team-board').forEach(el => el.classList.remove('current-turn'));
            const target = document.getElementById(`board-${currentPicker}`);
            if (target) target.classList.add('current-turn');
        }

        function renderPool(myRosterFilter = null) {
            const container = document.getElementById('pool-list');
            container.innerHTML = '';

            POOL_DATA.forEach((p, origIdx) => {
                // 실제 available 배열에 있는지 확인
                const isAvailable = availablePlayers.some(avail => avail.name === p.name);
                
                const div = document.createElement('div');
                div.className = `player-card ${isAvailable ? '' : 'picked'}`;
                
                // 내 턴이고, 내가 이미 그 포지션을 가지고 있으면 비활성화 (시각적)
                if (isAvailable && myRosterFilter && myRosterFilter[p.pos] !== null) {
                    div.classList.add('disabled');
                }

                div.innerHTML = `
                    <span class="pos-badge pos-${p.pos}">${p.pos}</span><br>
                    <strong>${p.name}</strong>
                `;

                if (isAvailable) {
                    // 현재 availablePlayers 내의 인덱스를 찾아야 함 (userPick용)
                    // 하지만 여기선 그냥 클릭 시 이름 매칭해서 처리하는게 안전
                    div.onclick = () => {
                        const realIdx = availablePlayers.findIndex(x => x.name === p.name);
                        if (realIdx > -1) userPick(realIdx);
                    };
                }
                
                container.appendChild(div);
            });
        }

        function renderBoards() {
            const container = document.getElementById('team-boards');
            container.innerHTML = '';

            // 순서는 draftOrder(지명 순서)가 아니라 고정된 순서(혹은 가나다)로 보여주는 게 보기 편할 수 있음.
            // 여기선 CAPTAINS 배열 순서대로 보여줌
            CAPTAINS.forEach(cap => {
                const roster = teams[cap];
                const isMe = cap === myCaptain;
                
                let html = `<div id="board-${cap}" class="team-board ${isMe ? 'my-team' : ''}">
                    <div class="team-name">${cap} ${isMe ? '(나)' : ''}</div>`;
                
                ['TOP', 'JUNGLE', 'MID', 'BOT', 'SUP'].forEach(pos => {
                    const name = roster[pos];
                    html += `
                        <div class="roster-slot ${name ? 'filled' : 'empty'}">
                            <span>${pos}</span>
                            <span>${name || '-'}</span>
                        </div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function addLog(msg) {
            const box = document.getElementById('log-box');
            const p = document.createElement('div');
            p.className = 'log-new';
            p.innerText = `> ${msg}`;
            box.prepend(p);
        }

        function endGame() {
            document.getElementById('screen-draft').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            document.getElementById('final-boards').innerHTML = document.getElementById('team-boards').innerHTML;
        }

        init();
    </script>
</body>
</html>
