<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 치지직 컵 멀티 드래프트 (5인 자동시작)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --chzzk-green: #00ffa3;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        h1, h2, h3 { text-align: center; margin: 10px 0; }
        .accent { color: var(--chzzk-green); font-weight: bold; }

        /* 싱글버전 링크 스타일 */
        .single-link {
            color: #aaa;
            text-decoration: none;
            border-bottom: 1px solid #555;
            padding-bottom: 2px;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .single-link:hover {
            color: var(--chzzk-green);
            border-color: var(--chzzk-green);
        }
        
        /* Layout */
        .container {
            width: 100%; max-width: 1100px; background: var(--card-bg);
            padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px; display: none;
        }
        .container.active { display: block; }

        /* Lobby */
        .lobby-box { text-align: center; padding: 20px; }
        input[type="text"] {
            padding: 10px; border-radius: 5px; border: 1px solid #555; 
            background: #222; color: white; width: 200px; text-align: center; margin-right: 10px;
        }
        button {
            background: #333; color: white; border: 2px solid var(--chzzk-green);
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        button:hover { background: var(--chzzk-green); color: black; }
        button:disabled { border-color: #555; color: #777; cursor: not-allowed; background: #222; }

        .room-id-display {
            font-size: 1.5rem; color: var(--chzzk-green); font-weight: bold;
            border: 2px dashed #555; padding: 15px; margin: 20px auto; display: inline-block; user-select: all;
        }
        .player-list { margin-top: 20px; background: #111; padding: 10px; border-radius: 8px; text-align: left; }
        .waiting-msg { color: #aaa; font-size: 0.9rem; margin-top: 10px; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* Game Screen */
        .status-bar {
            text-align: center; padding: 15px; background: #2a2a2a;
            border-radius: 8px; margin-bottom: 20px; border: 1px solid #444;
        }
        .turn-msg { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; color: white; }
        
        .pool-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 30px;
        }
        .player-card {
            background: #333; padding: 10px; border-radius: 6px; text-align: center;
            cursor: pointer; border: 1px solid #444; position: relative; overflow: hidden;
        }
        .player-card:hover { border-color: var(--chzzk-green); background: #444; transform: translateY(-2px); }
        .player-card.disabled { opacity: 0.2; pointer-events: none; filter: grayscale(100%); }
        
        .tier-badge {
            position: absolute; top: 0; right: 0; font-size: 0.7rem; padding: 2px 5px;
            background: #555; color: white; border-bottom-left-radius: 5px;
        }
        .tier-S { background: #ff4757; color: white; }
        .tier-A { background: #ffa502; color: black; }
        .tier-B { background: #2ed573; color: black; }
        .tier-C { background: #a4b0be; color: black; }

        .pos-badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 4px;}
        .pos-TOP { background: #ff5f5f; color: white; }
        .pos-MID { background: #5fafff; color: white; }
        .pos-BOT { background: #ffaf5f; color: black; }
        .pos-SUP { background: #af5fff; color: white; }

        .teams-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; overflow-x: auto; }
        .team-board { background: #252525; padding: 10px; border-radius: 8px; min-width: 150px; }
        .team-board.my-team { border: 2px solid var(--chzzk-green); background: #2f3f35; }
        .team-board.current-turn { box-shadow: 0 0 15px var(--chzzk-green); border-color: var(--chzzk-green); transform: scale(1.02); transition: 0.3s;}
        
        .team-header { font-weight: bold; text-align: center; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 5px; }
        .owner-badge { font-size: 0.7rem; color: #aaa; display: block; font-weight: normal;}
        .roster-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 3px 0; }
        .roster-row.filled { color: var(--chzzk-green); }
        
        .log-box {
            height: 120px; overflow-y: auto; background: #111; border: 1px solid #333;
            padding: 10px; margin-top: 20px; font-size: 0.85rem; color: #aaa;
        }
        .log-hl { color: var(--chzzk-green); font-weight: bold; }

        @media (max-width: 768px) { .teams-container { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <h1>2025 <span class="accent">CHZZK CUP</span> 멀티 드래프트</h1>

    <div id="screen-lobby" class="container active">
        <div class="lobby-box">
            <h2>대기실</h2>

            <p style="margin-bottom: 30px;">
                <a href="https://skfnbsadfkjbsdf.github.io/chzzk_draft/d5.html" class="single-link">
                    🎲 혼자하기 (싱글 버전) 이동
                </a>
            </p>
            
            <div id="initial-choice">
                <button onclick="createRoom()">방 만들기 (Host)</button>
                <br><br>
                <div>
                    <input type="text" id="room-id-input" placeholder="방 ID 입력">
                    <button onclick="joinRoom()">참가하기 (Guest)</button>
                </div>
                <p id="conn-status" style="color:#aaa; margin-top:10px;"></p>
            </div>

            <div id="host-ui" style="display:none; margin-top:20px;">
                <p>친구에게 ID를 공유하세요 (최대 5명)</p>
                <div id="my-room-id" class="room-id-display">생성 중...</div>
                <div class="player-list">
                    <strong>접속자 현황 (<span id="player-count">1</span>/5):</strong>
                    <ul id="player-ul" style="padding-left: 20px; margin: 5px 0;"></ul>
                </div>
                <p class="waiting-msg">5명이 모두 모이면 자동으로 시작됩니다...</p>
            </div>

            <div id="guest-ui" style="display:none; margin-top:20px;">
                <h3>대기 중...</h3>
                <p>5명이 모이면 게임이 시작됩니다.</p>
                <p id="guest-status-msg" style="color: var(--chzzk-green);"></p>
            </div>
        </div>
    </div>

    <div id="screen-game" class="container">
        <div class="status-bar">
            <div id="turn-msg" class="turn-msg">게임 준비 중...</div>
            <div id="draft-info" style="font-size: 0.9rem; color: #ccc;"></div>
        </div>

        <h3>영입 가능 선수 (실력순)</h3>
        <div class="pool-grid" id="pool-list"></div>

        <h3>실시간 팀 상황</h3>
        <div class="teams-container" id="team-boards"></div>

        <div class="log-box" id="log-box"></div>
    </div>

    <script>
        // 데이터
        const CAPTAINS = ['갱맘', '뱅', '소우릎', '울프', '큐베'];
        const POOL_DATA = [
            // TOP
            { name: '운타라', pos: 'TOP', score: 95, tier: 'S' },
            { name: '김뿡', pos: 'TOP', score: 88, tier: 'A' },
            { name: '룩삼', pos: 'TOP', score: 78, tier: 'B' },
            { name: '얍얍', pos: 'TOP', score: 74, tier: 'B' },
            { name: '한동숙', pos: 'TOP', score: 65, tier: 'C' },
            
            // MID
            { name: '앰비션', pos: 'MID', score: 99, tier: 'S' },
            { name: '인섹', pos: 'MID', score: 94, tier: 'S' },
            { name: '피닉스박', pos: 'MID', score: 85, tier: 'A' },
            { name: '랄로', pos: 'MID', score: 77, tier: 'B' },
            { name: '트롤야', pos: 'MID', score: 60, tier: 'C' },

            // BOT
            { name: '괴물쥐', pos: 'BOT', score: 89, tier: 'A' },
            { name: '명예훈장', pos: 'BOT', score: 79, tier: 'B' },
            { name: '삼식', pos: 'BOT', score: 79, tier: 'B' },
            { name: '러너', pos: 'BOT', score: 79, tier: 'B' },
            { name: '따효니', pos: 'BOT', score: 79, tier: 'B' },

            // SUP
            { name: '순당무', pos: 'SUP', score: 92, tier: 'S' },
            { name: '인간젤리', pos: 'SUP', score: 87, tier: 'A' },
            { name: '던', pos: 'SUP', score: 75, tier: 'B' },
            { name: '푸린', pos: 'SUP', score: 72, tier: 'B' },
            { name: '소풍왔니', pos: 'SUP', score: 68, tier: 'C' }
        ];

        // 전역 변수
        let peer = null;
        let myConn = null; 
        let guestConns = []; 
        let isHost = false;
        let myId = null;
        
        // 게임 상태
        let gameState = {
            players: [], // { id, name, assignedCaptain }
            teams: {},   
            availablePlayers: [],
            draftOrder: [], 
            pickIndex: 0,
            logs: []
        };

        // ==========================
        // P2P 네트워크 (PeerJS)
        // ==========================
        
        function initPeer(onOpen) {
            peer = new Peer(null, { debug: 1 });
            
            peer.on('open', (id) => {
                myId = id;
                if(onOpen) onOpen(id);
            });

            peer.on('connection', (conn) => {
                if (!isHost) return; 
                
                conn.on('open', () => {
                    handleGuestJoin(conn);
                });
                
                conn.on('data', (data) => {
                    if(data.type === 'PICK') handlePickRequest(conn.peer, data.idx);
                });
            });

            peer.on('error', (err) => {
                alert("오류: " + err.type);
            });
        }

        function createRoom() {
            document.getElementById('conn-status').innerText = "방 생성 중...";
            isHost = true;

            initPeer((id) => {
                document.getElementById('initial-choice').style.display = 'none';
                document.getElementById('host-ui').style.display = 'block';
                document.getElementById('my-room-id').innerText = id;
                
                // 방장 등록
                gameState.players.push({ id: id, name: '방장(나)', assignedCaptain: null });
                updateLobbyUI();
            });
        }

        function joinRoom() {
            const roomId = document.getElementById('room-id-input').value.trim();
            if(!roomId) return alert("방 ID를 입력하세요");

            document.getElementById('conn-status').innerText = "접속 시도 중...";
            isHost = false;

            initPeer((id) => {
                myConn = peer.connect(roomId);
                
                myConn.on('open', () => {
                    document.getElementById('initial-choice').style.display = 'none';
                    document.getElementById('guest-ui').style.display = 'block';
                });

                myConn.on('data', (data) => {
                    if (data.type === 'STATE_UPDATE') {
                        gameState = data.state;
                        renderGame();
                    } else if (data.type === 'START') {
                        document.getElementById('screen-lobby').classList.remove('active');
                        document.getElementById('screen-game').classList.add('active');
                        renderGame();
                    } else if (data.type === 'ERROR') {
                        alert(data.msg);
                        location.reload(); // 차단되면 새로고침
                    }
                });
                
                myConn.on('close', () => {
                    alert("연결이 끊어졌습니다.");
                    location.reload();
                });
            });
        }

        // [HOST] 게스트 입장 처리 (인원 제한 및 자동 시작)
        function handleGuestJoin(conn) {
            // 1. 인원 제한 체크 (이미 5명이면 거절)
            if(gameState.players.length >= 5) {
                setTimeout(() => {
                    conn.send({ type: 'ERROR', msg: '방이 꽉 찼습니다. (최대 5명)' });
                    setTimeout(() => conn.close(), 500);
                }, 500);
                return;
            }

            // 2. 입장 허용
            guestConns.push(conn);
            gameState.players.push({ id: conn.peer, name: `참가자 ${gameState.players.length}`, assignedCaptain: null });
            updateLobbyUI();

            // 3. 자동 시작 체크
            if (gameState.players.length === 5) {
                setTimeout(() => {
                    gameStart(); // 5명 다 차면 1초 뒤 자동 시작
                }, 1000);
            }
        }

        function updateLobbyUI() {
            const ul = document.getElementById('player-ul');
            const cnt = document.getElementById('player-count');
            ul.innerHTML = '';
            gameState.players.forEach(p => {
                const li = document.createElement('li');
                li.innerText = p.name;
                ul.appendChild(li);
            });
            cnt.innerText = gameState.players.length;
        }

        function broadcastState() {
            const packet = { type: 'STATE_UPDATE', state: gameState };
            guestConns.forEach(c => c.send(packet));
            renderGame();
        }

        // ==========================
        // 게임 로직 (Host Only)
        // ==========================

        function gameStart() {
            if (!isHost) return;

            // 초기화
            gameState.availablePlayers = JSON.parse(JSON.stringify(POOL_DATA)).sort((a, b) => b.score - a.score);
            gameState.draftOrder = [...CAPTAINS].sort(() => Math.random() - 0.5);
            gameState.pickIndex = 0;
            gameState.teams = {};

            const shuffledCaps = [...CAPTAINS].sort(() => Math.random() - 0.5);
            
            CAPTAINS.forEach(cap => {
                gameState.teams[cap] = { 
                    TOP: null, JUNGLE: cap, MID: null, BOT: null, SUP: null, 
                    ownerId: 'AI', ownerName: 'AI'
                };
            });

            // 플레이어에게 팀장 배정
            gameState.players.forEach((p, idx) => {
                if (idx < 5) {
                    const assignedCap = shuffledCaps[idx];
                    p.assignedCaptain = assignedCap;
                    gameState.teams[assignedCap].ownerId = p.id;
                    gameState.teams[assignedCap].ownerName = p.name;
                }
            });

            addGameLog(`게임 시작! 드래프트 순서: ${gameState.draftOrder.join(' → ')}`);

            // 모두에게 시작 신호
            guestConns.forEach(c => c.send({ type: 'START' }));
            document.getElementById('screen-lobby').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            
            broadcastState();
            checkAiTurn();
        }

        function handlePickRequest(peerId, playerIdx) {
            if(!isHost) return;
            const currentCap = getCurrentPicker();
            const teamInfo = gameState.teams[currentCap];
            if (teamInfo.ownerId !== peerId) return; // 턴 아님
            processPick(currentCap, playerIdx);
        }

        function processPick(capName, playerIdx) {
            const player = gameState.availablePlayers[playerIdx];
            if (!player) return;
            if (gameState.teams[capName][player.pos] !== null) return;

            gameState.teams[capName][player.pos] = player.name;
            gameState.availablePlayers.splice(playerIdx, 1);
            
            addGameLog(`[${capName}] ${player.name} (${player.pos}) 영입!`);
            gameState.pickIndex++;
            
            broadcastState();
            checkAiTurn();
        }

        function checkAiTurn() {
            if (gameState.pickIndex >= 20) return;
            const currentCap = getCurrentPicker();
            const teamInfo = gameState.teams[currentCap];

            if (teamInfo.ownerId === 'AI') {
                setTimeout(() => aiPick(currentCap), 1000);
            }
        }

        function aiPick(capName) {
            const roster = gameState.teams[capName];
            const neededPos = ['TOP', 'MID', 'BOT', 'SUP'].filter(p => roster[p] === null);
            const candidates = gameState.availablePlayers.filter(p => neededPos.includes(p.pos));
            
            if (candidates.length > 0) {
                const pickName = candidates[0].name;
                const realIdx = gameState.availablePlayers.findIndex(p => p.name === pickName && p.pos === candidates[0].pos);
                processPick(capName, realIdx);
            }
        }

        function getCurrentPicker() {
            const idx = gameState.pickIndex;
            const round = Math.floor(idx / 5);
            const idxInRound = idx % 5;
            const actualIdx = (round % 2 === 0) ? idxInRound : (4 - idxInRound);
            return gameState.draftOrder[actualIdx];
        }

        function addGameLog(msg) {
            gameState.logs.push(msg);
        }

        // ==========================
        // 렌더링
        // ==========================

        function renderGame() {
            // 로그
            const logBox = document.getElementById('log-box');
            logBox.innerHTML = '';
            [...gameState.logs].reverse().forEach(msg => {
                const div = document.createElement('div');
                div.innerHTML = `> ${msg}`;
                if(msg.includes('영입')) div.classList.add('log-hl');
                logBox.appendChild(div);
            });

            if (gameState.pickIndex >= 20) {
                document.getElementById('turn-msg').innerText = "드래프트 종료!";
                document.getElementById('draft-info').innerText = "모든 로스터가 확정되었습니다.";
                renderBoards();
                renderPool();
                return;
            }

            const currentCap = getCurrentPicker();
            const teamInfo = gameState.teams[currentCap];
            const isMyTurn = (teamInfo.ownerId === myId);

            const turnMsg = document.getElementById('turn-msg');
            if (isMyTurn) {
                turnMsg.innerText = "당신의 차례입니다! 선수를 선택하세요.";
                turnMsg.style.color = "var(--chzzk-green)";
            } else {
                turnMsg.innerText = `${currentCap} (${teamInfo.ownerName}) 님이 고민 중...`;
                turnMsg.style.color = "white";
            }
            document.getElementById('draft-info').innerText = `라운드 ${Math.floor(gameState.pickIndex/5) + 1} / 4 (전체 ${gameState.pickIndex + 1}픽)`;

            renderPool(isMyTurn, currentCap);
            renderBoards(currentCap);
        }

        function renderPool(isMyTurn, currentCap) {
            const pool = document.getElementById('pool-list');
            pool.innerHTML = '';

            gameState.availablePlayers.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = 'player-card';
                let disabled = false;
                if (isMyTurn) {
                    if (gameState.teams[currentCap][p.pos] !== null) disabled = true;
                } else {
                    disabled = true; 
                }
                if(disabled) div.classList.add('disabled');

                const tierVal = p.tier || 'C';
                div.innerHTML = `
                    <div class="tier-badge tier-${tierVal.charAt(0)}">${tierVal}</div>
                    <span class="pos-badge pos-${p.pos}">${p.pos}</span><br>
                    <strong style="font-size:1.1em;">${p.name}</strong>
                `;
                div.onclick = () => {
                    if (!isMyTurn || disabled) return;
                    if (isHost) processPick(currentCap, idx);
                    else myConn.send({ type: 'PICK', idx: idx });
                };
                pool.appendChild(div);
            });
        }

        function renderBoards(currentCap) {
            const boardContainer = document.getElementById('team-boards');
            boardContainer.innerHTML = '';

            CAPTAINS.forEach(cap => {
                const t = gameState.teams[cap];
                const isMine = (t.ownerId === myId);
                const isTurn = (cap === currentCap && gameState.pickIndex < 20);
                
                let html = `<div class="team-board ${isMine ? 'my-team' : ''} ${isTurn ? 'current-turn' : ''}">
                    <div class="team-header">
                        ${cap} 
                        <span class="owner-badge">${t.ownerName === '방장(나)' && !isHost ? '방장' : t.ownerName}</span>
                    </div>`;
                
                ['TOP', 'JUNGLE', 'MID', 'BOT', 'SUP'].forEach(pos => {
                    const mem = t[pos];
                    html += `<div class="roster-row ${mem ? 'filled' : ''}">
                        <span>${pos}</span> <span>${mem || '-'}</span>
                    </div>`;
                });
                html += `</div>`;
                boardContainer.innerHTML += html;
            });
        }
    </script>
</body>
</html>
